<!doctype html>
<html lang="zh-Hans">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>页面不存在 — SnapGlass</title>
  <style>
    :root { color-scheme: light dark; --bg: #f5f5f7; --text: #1d1d1f; --muted: #6e6e73; --accent: #0a84ff; }
    @media (prefers-color-scheme: dark) { :root { --bg: #08080a; --text: #f5f5f7; --muted: #a1a1a6; --accent: #4da3ff; } }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px; background: var(--bg); color: var(--text); font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", sans-serif; }
    main { max-width: 520px; text-align: center; }
    h1 { margin: 0 0 12px; font-size: clamp(2.4rem, 9vw, 4rem); letter-spacing: -0.04em; }
    p { margin: 0 0 28px; color: var(--muted); line-height: 1.7; }
    nav { display: flex; flex-wrap: wrap; justify-content: center; gap: 12px; }
    a { color: var(--accent); text-decoration: none; border: 1px solid color-mix(in srgb, var(--accent) 35%, transparent); padding: 10px 18px; border-radius: 999px; font-weight: 600; }
    a:hover { background: color-mix(in srgb, var(--accent) 10%, transparent); }
  </style>
</head>
<body>
  <main>
    <h1>404</h1>
    <p>这个页面不存在，可能已经移动。<br>The page does not exist or has moved.</p>
    <nav>
      <a href="/snapocr/">简体中文首页</a>
      <a href="/snapocr/en/" lang="en">English home</a>
      <a href="https://github.com/blackkcold/snapocr" target="_blank" rel="noopener">GitHub</a>
    </nav>
  </main>
</body>
</html>
