<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="robots" content="noindex">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SnapGlass — social card</title>
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; width: 1200px; height: 630px; overflow: hidden; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", "PingFang SC", sans-serif;
      background:
        radial-gradient(700px 520px at 8% 0%, rgba(10, 132, 255, 0.38), transparent 68%),
        radial-gradient(620px 520px at 100% 100%, rgba(94, 92, 230, 0.34), transparent 70%),
        linear-gradient(145deg, #08080a 0%, #101017 100%);
      color: #f5f5f7;
      -webkit-font-smoothing: antialiased;
    }
    .card {
      position: relative;
      width: 100%;
      height: 100%;
      padding: 62px 64px;
      display: grid;
      grid-template-columns: 1.08fr 0.92fr;
      gap: 42px;
      align-items: center;
    }
    .card::after {
      content: "";
      position: absolute;
      inset: 0;
      background: linear-gradient(120deg, rgba(255, 255, 255, 0.06), transparent 36%);
      pointer-events: none;
    }
    .left { position: relative; z-index: 1; }
    .brand {
      display: flex;
      align-items: center;
      gap: 14px;
      font-size: 26px;
      font-weight: 700;
      letter-spacing: -0.02em;
    }
    .logo {
      width: 46px;
      height: 46px;
      border-radius: 13px;
      display: grid;
      place-items: center;
      background: linear-gradient(140deg, #2f8cff 0%, #5e5ce6 58%, #9a5cff 100%);
      box-shadow: 0 12px 28px rgba(10, 132, 255, 0.36);
    }
    .logo svg { width: 28px; height: 28px; }
    .eyebrow {
      margin-top: 34px;
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 15px;
      font-weight: 600;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: #a1a1a6;
    }
    .dot { width: 8px; height: 8px; border-radius: 50%; background: #30d158; box-shadow: 0 0 0 5px rgba(48, 209, 88, 0.14); }
    h1 {
      margin: 16px 0 0;
      font-size: 68px;
      line-height: 1.02;
      letter-spacing: -0.045em;
      font-weight: 700;
    }
    .gradient {
      background: linear-gradient(100deg, #4da3ff 0%, #8b87ff 60%, #c05cff 100%);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }
    p {
      margin: 24px 0 0;
      max-width: 520px;
      font-size: 21px;
      line-height: 1.5;
      color: #a1a1a6;
    }
    .url {
      margin-top: 34px;
      display: inline-flex;
      align-items: center;
      gap: 9px;
      padding: 8px 13px;
      border-radius: 999px;
      border: 1px solid rgba(255, 255, 255, 0.14);
      background: rgba(255, 255, 255, 0.05);
      font-size: 16px;
      font-weight: 600;
      color: #d8d8de;
    }
    .url strong { color: #8ec5ff; font-weight: 600; }

    .right {
      position: relative;
      z-index: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0;
    }
    .shelf {
      width: 100%;
      max-width: 460px;
      padding: 18px 18px 24px;
      border-radius: 24px;
      background: linear-gradient(180deg, #1c1c20 0%, #121214 100%);
      border: 1px solid rgba(255, 255, 255, 0.1);
      box-shadow: 0 34px 70px rgba(0, 0, 0, 0.5), inset 0 1px 0 rgba(255, 255, 255, 0.08);
      transform: rotate(-1.2deg);
    }
    .handle { width: 56px; height: 6px; margin: 0 auto 16px; border-radius: 999px; background: rgba(255, 255, 255, 0.2); }
    .cards { display: flex; align-items: flex-end; justify-content: center; gap: 12px; }
    .shot {
      position: relative;
      width: 31%;
      aspect-ratio: 1.36;
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 14px 26px rgba(0, 0, 0, 0.36);
      transform: rotate(-2.4deg);
    }
    .shot:nth-child(2) { transform: rotate(1.2deg) translateY(-6px); }
    .shot:nth-child(3) { transform: rotate(3deg) translateY(1px); }
    .a { background: linear-gradient(135deg, #f7a06d 0%, #e15b5b 100%); }
    .b { background: linear-gradient(135deg, #a78bfa 0%, #5e5ce6 100%); outline: 2px dashed rgba(255, 255, 255, 0.72); outline-offset: 4px; }
    .c { background: linear-gradient(135deg, #6ab3ff 0%, #3b82f6 62%, #3450d8 100%); }
    .shot::before {
      content: "";
      position: absolute;
      inset: 12% 10% 46%;
      border-radius: 6px;
      background: rgba(255, 255, 255, 0.24);
    }
    .shot::after {
      content: "";
      position: absolute;
      left: 10%;
      right: 22%;
      bottom: 13%;
      height: 22px;
      background:
        linear-gradient(rgba(255, 255, 255, 0.46), rgba(255, 255, 255, 0.46)) 0 0 / 100% 4px no-repeat,
        linear-gradient(rgba(255, 255, 255, 0.4), rgba(255, 255, 255, 0.4)) 0 9px / 82% 4px no-repeat,
        linear-gradient(rgba(255, 255, 255, 0.34), rgba(255, 255, 255, 0.34)) 0 18px / 58% 4px no-repeat;
      border-radius: 999px;
    }
    .bar {
      margin-top: -18px;
      display: flex;
      align-items: center;
      gap: 2px;
      padding: 7px;
      border-radius: 14px;
      background: rgba(30, 30, 33, 0.96);
      border: 1px solid rgba(255, 255, 255, 0.1);
      box-shadow: 0 20px 44px rgba(0, 0, 0, 0.46);
      white-space: nowrap;
    }
    .bar span {
      padding: 7px 10px;
      border-radius: 9px;
      font-size: 13px;
      font-weight: 500;
      color: #f5f5f7;
    }
    .bar kbd { font-family: inherit; font-size: 11px; color: rgba(255, 255, 255, 0.55); margin-left: 4px; }
    .version {
      position: absolute;
      right: 64px;
      top: 62px;
      bottom: auto;
      font-size: 14px;
      color: #8a8a90;
      letter-spacing: 0.02em;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="left">
      <div class="brand">
        <span class="logo">
          <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.8" stroke-linecap="round">
            <circle cx="12" cy="12" r="4.2"/>
            <path d="M12 3.5v2.1M12 18.4v2.1M3.5 12h2.1M18.4 12h2.1M5.9 5.9l1.5 1.5M16.6 16.6l1.5 1.5M18.1 5.9l-1.5 1.5M7.4 16.6l-1.5 1.5"/>
          </svg>
        </span>
        <span>SnapGlass</span>
      </div>

      <div class="eyebrow"><span class="dot"></span>macOS · Offline-first · MIT</div>
      <h1>Screenshots<br><span class="gradient">that go somewhere.</span></h1>
      <p>Capture, scrolling capture, OCR, and recording in one workflow. Recognition stays on your Mac.</p>
      <div class="url">blackkcold.github.io/<strong>snapocr</strong></div>
    </div>

    <div class="right">
      <div class="shelf">
        <div class="handle"></div>
        <div class="cards">
          <div class="shot a"></div>
          <div class="shot b"></div>
          <div class="shot c"></div>
        </div>
      </div>
      <div class="bar">
        <span>Copy<kbd>↵</kbd></span>
        <span>Barcode<kbd>S</kbd></span>
        <span>Edit<kbd>E</kbd></span>
        <span>Pin<kbd>⌘P</kbd></span>
      </div>
    </div>
    <div class="version">Universal · No telemetry</div>
  </div>
</body>
</html>
