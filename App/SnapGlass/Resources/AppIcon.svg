    <rect x="618" y="337" width="146" height="324" rx="36" fill="url(#paper)"/>
    <path d="M657 414h69M657 471h69M657 528h47" stroke="#25448F" stroke-opacity="0.72" stroke-width="17" stroke-linecap="round"/>
