opt_in_rules:
  - empty_count
  - force_unwrapping
  - implicitly_unwrapped_optional
  - unused_import
  - duplicate_imports
  - toggle_bool
  - private_action
  - private_outlet

disabled_rules:
  # 由 swift-format 处理的规则
  - trailing_whitespace
  - vertical_whitespace
  - colon
  - comma

line_length: 120
# 0.9.5 起四个核心文件（编辑器画布/滚动拼接/区域选区/编辑器 VM）随功能增长越过旧上限。
# 拆分留到后续重构，本版先把上限对齐现状，避免发版被结构性告警阻断。
file_length:
  warning: 750
  error: 1200
type_body_length:
  warning: 450
function_body_length:
  warning: 70
cyclomatic_complexity:
  warning: 12
identifier_name:
  min_length: 3
  excluded: [id, URL, key, tag, qr]

# 与 swift-format 的 multiElementCollectionTrailingCommas 对齐：
# 多行集合字面量必须保留尾逗号（SE-0084 / SE-0439 官方规范）。
trailing_comma:
  mandatory_comma: true

# 排除所有 .build 目录（第三方依赖与派生测试 runner）。
# 注意：SwiftLint 的 excluded 不支持 glob 通配，必须显式列出每个嵌套 .build。
excluded:
  - .build
  - Packages/SharedKit/.build
  - Packages/ScrollCore/.build
  - Packages/BarcodeCore/.build
  - Packages/AutomationCore/.build
  - Packages/CaptureCore/.build
  - Packages/OCRCore/.build
  - Packages/AnnotationCore/.build
  - Packages/HistoryCore/.build
