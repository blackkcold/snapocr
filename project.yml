name: SnapGlass

options:
  bundleIdPrefix: com.snapglass
  deploymentTarget:
    macOS: "13.0"
  generateEmptyDirectories: true
  defaultConfig: Debug
  groupSortPosition: top
  createIntermediateGroups: true
  xcodeVersion: "16.0"

settings:
  base:
    SWIFT_VERSION: "6.0"
    MACOSX_DEPLOYMENT_TARGET: "13.0"
  configs:
    Debug:
      SWIFT_ACTIVE_COMPILATION_CONDITIONS: DEBUG
      SWIFT_OPTIMIZATION_LEVEL: "-Onone"
    Release:
      SWIFT_ACTIVE_COMPILATION_CONDITIONS: ""
      SWIFT_OPTIMIZATION_LEVEL: "-O"
      SWIFT_COMPILATION_MODE: wholemodule

packages:
  SharedKit:
    path: Packages/SharedKit
  CaptureCore:
    path: Packages/CaptureCore
  OCRCore:
    path: Packages/OCRCore
  BarcodeCore:
    path: Packages/BarcodeCore
  AnnotationCore:
    path: Packages/AnnotationCore
  ScrollCore:
    path: Packages/ScrollCore
  HistoryCore:
    path: Packages/HistoryCore
  AutomationCore:
    path: Packages/AutomationCore

targets:
  SnapGlass:
    type: application
    platform: macOS
    sources:
      - path: App/SnapGlass/Sources
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_NSScreenCaptureUsageDescription: "SnapGlass needs screen capture permission to take screenshots and perform OCR recognition."
        INFOPLIST_KEY_NSHumanReadableCopyright: "Copyright © 2026 SnapGlass Contributors"
        INFOPLIST_KEY_LSApplicationCategoryType: "public.app-category.utilities"
        INFOPLIST_KEY_CFBundleDevelopmentRegion: en
        INFOPLIST_KEY_CFBundleDisplayName: SnapGlass
        INFOPLIST_KEY_CFBundleName: SnapGlass
        INFOPLIST_KEY_CFBundleShortVersionString: "0.1.5"
        INFOPLIST_KEY_CFBundleVersion: "1"
        PRODUCT_BUNDLE_IDENTIFIER: com.snapglass.app
        PRODUCT_NAME: SnapGlass
        CODE_SIGN_ENTITLEMENTS: App/SnapGlass/SnapGlass.entitlements
        ENABLE_HARDENED_RUNTIME: YES
        DEVELOPMENT_TEAM: "${DEVELOPMENT_TEAM}"
        CODE_SIGN_IDENTITY: "${CODE_SIGN_IDENTITY:--}"
    dependencies:
      - package: SharedKit
      - package: CaptureCore
      - package: OCRCore
      - package: BarcodeCore
      - package: AnnotationCore
      - package: ScrollCore
      - package: HistoryCore
      - package: AutomationCore
    preBuildScripts:
      - name: "SwiftLint"
        basedOnDependencyAnalysis: false
        script: |
          if which swiftlint > /dev/null; then
            swiftlint lint --config "${SRCROOT}/.swiftlint.yml" --path "${SRCROOT}/App/SnapGlass"
          else
            echo "warning: SwiftLint not installed"
          fi
    scheme: {}

  SnapGlassCLI:
    type: tool
    platform: macOS
    sources:
      - path: App/SnapGlassCLI
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDevelopmentRegion: en
        PRODUCT_BUNDLE_IDENTIFIER: com.snapglass.cli
        PRODUCT_NAME: SnapGlassCLI
        SWIFT_VERSION: "6.0"
        MACOSX_DEPLOYMENT_TARGET: "13.0"
        DEVELOPMENT_TEAM: ""
    dependencies:
      - package: SharedKit
      - package: CaptureCore
      - package: OCRCore
      - package: BarcodeCore
      - package: AutomationCore
    scheme: {}
