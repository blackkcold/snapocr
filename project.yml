name: SnapGlass

options:
  bundleIdPrefix: com.snapglass
  deploymentTarget:
    macOS: "13.0"
  generateEmptyDirectories: true
  defaultConfig: Debug
  groupSortPosition: top
  createIntermediateGroups: true
  xcodeVersion: "16.0"

settings:
  base:
    SWIFT_VERSION: "6.0"
    MACOSX_DEPLOYMENT_TARGET: "13.0"
    ALWAYS_SEARCH_USER_PATHS: NO
    MARKETING_VERSION: "0.3.0"
    CURRENT_PROJECT_VERSION: "1"
  configs:
    Debug:
      SWIFT_ACTIVE_COMPILATION_CONDITIONS: DEBUG
      SWIFT_OPTIMIZATION_LEVEL: "-Onone"
    Release:
      SWIFT_ACTIVE_COMPILATION_CONDITIONS: ""
      SWIFT_OPTIMIZATION_LEVEL: "-O"
      SWIFT_COMPILATION_MODE: wholemodule

packages:
  SharedKit:
    path: Packages/SharedKit
  CaptureCore:
    path: Packages/CaptureCore
  OCRCore:
    path: Packages/OCRCore
  BarcodeCore:
    path: Packages/BarcodeCore
  AnnotationCore:
    path: Packages/AnnotationCore
  ScrollCore:
    path: Packages/ScrollCore
  HistoryCore:
    path: Packages/HistoryCore
targets:
  SnapGlass:
    type: application
    platform: macOS
    sources:
      - path: App/SnapGlass/Sources
        excludes:
          - Routing
      - path: App/SnapGlass/Resources/AppIcon.icns
        buildPhase: resources
      - path: App/SnapGlass/Resources/en.lproj
        buildPhase: resources
      - path: App/SnapGlass/Resources/zh-Hans.lproj
        buildPhase: resources
    settings:
      base:
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: App/SnapGlass/Sources/Info.plist
        PRODUCT_BUNDLE_IDENTIFIER: com.snapglass.app
        PRODUCT_NAME: SnapGlass
        CODE_SIGN_ENTITLEMENTS: App/SnapGlass/SnapGlass.entitlements
        ENABLE_HARDENED_RUNTIME: YES
        DEVELOPMENT_TEAM: "${DEVELOPMENT_TEAM}"
        CODE_SIGN_IDENTITY: "${CODE_SIGN_IDENTITY:--}"
    dependencies:
      - package: SharedKit
      - package: CaptureCore
      - package: OCRCore
      - package: BarcodeCore
      - package: AnnotationCore
      - package: ScrollCore
      - package: HistoryCore
    preBuildScripts:
      - name: "SwiftLint"
        basedOnDependencyAnalysis: false
        script: |
          if which swiftlint > /dev/null; then
            swiftlint lint --config "${SRCROOT}/.swiftlint.yml" --path "${SRCROOT}/App/SnapGlass"
          else
            echo "warning: SwiftLint not installed"
          fi
    scheme: {}
