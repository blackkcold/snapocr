name: SnapGlass

options:
  bundleIdPrefix: com.snapglass
  deploymentTarget:
    macOS: "13.0"
  generateEmptyDirectories: true
  defaultConfig: Debug
  groupSortPosition: top
  createIntermediateGroups: true
  xcodeVersion: "16.0"

settings:
  base:
    SWIFT_VERSION: "6.0"
    MACOSX_DEPLOYMENT_TARGET: "13.0"
    ALWAYS_SEARCH_USER_PATHS: NO
    MARKETING_VERSION: "1.5.1"
    CURRENT_PROJECT_VERSION: "2"
  configs:
    Debug:
      SWIFT_ACTIVE_COMPILATION_CONDITIONS: DEBUG
      SWIFT_OPTIMIZATION_LEVEL: "-Onone"
      ONLY_ACTIVE_ARCH: YES
    Release:
      SWIFT_ACTIVE_COMPILATION_CONDITIONS: ""
      SWIFT_OPTIMIZATION_LEVEL: "-O"
      SWIFT_COMPILATION_MODE: wholemodule

packages:
  SharedKit:
    path: Packages/SharedKit
  CaptureCore:
    path: Packages/CaptureCore
  OCRCore:
    path: Packages/OCRCore
  BarcodeCore:
    path: Packages/BarcodeCore
  AnnotationCore:
    path: Packages/AnnotationCore
  ScrollCore:
    path: Packages/ScrollCore
  HistoryCore:
    path: Packages/HistoryCore
  KeyboardShortcuts:
    url: https://github.com/sindresorhus/KeyboardShortcuts
    from: 2.0.0
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    exactVersion: 2.10.1
targets:
  SnapGlass:
    type: application
    platform: macOS
    sources:
      - path: App/SnapGlass/Sources
        excludes:
          - Routing
      - path: App/SnapGlass/Resources/AppIcon.icns
        buildPhase: resources
      - path: App/SnapGlass/Resources/en.lproj
        buildPhase: resources
      - path: App/SnapGlass/Resources/zh-Hans.lproj
        buildPhase: resources
      - path: App/SnapGlass/Resources/ja.lproj
        buildPhase: resources
      - path: App/SnapGlass/Resources/ko.lproj
        buildPhase: resources
    settings:
      base:
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: App/SnapGlass/Sources/Info.plist
        PRODUCT_BUNDLE_IDENTIFIER: com.snapglass.app
        PRODUCT_NAME: SnapGlass
        CODE_SIGN_ENTITLEMENTS: App/SnapGlass/SnapGlass.entitlements
        ENABLE_HARDENED_RUNTIME: NO
        # Sparkle is linked as @rpath/Sparkle.framework/... and lives in
        # Contents/Frameworks next to the executable.
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/../Frameworks"
        DEVELOPMENT_TEAM: "${DEVELOPMENT_TEAM}"
        CODE_SIGN_IDENTITY: "${CODE_SIGN_IDENTITY:--}"
    dependencies:
      - package: SharedKit
      - package: CaptureCore
      - package: OCRCore
      - package: BarcodeCore
      - package: AnnotationCore
      - package: ScrollCore
      - package: HistoryCore
      - package: KeyboardShortcuts
      - package: Sparkle
        product: Sparkle
        # XcodeGen's automatic embed looks for $(BUILT_PRODUCTS_DIR)/Sparkle,
        # but Sparkle ships as an xcframework; the framework is copied by the
        # "Embed Sparkle" script phase below instead.
        embed: false
        link: true
        # Xcode must not sign it: the release script signs every nested piece
        # of Sparkle with the stable self-signed identity, inside out.
        codeSign: false
    preBuildScripts:
      - name: "SwiftLint"
        basedOnDependencyAnalysis: false
        script: |
          if which swiftlint > /dev/null; then
            swiftlint lint --config "${SRCROOT}/.swiftlint.yml" "${SRCROOT}/App/SnapGlass"
          else
            echo "warning: SwiftLint not installed"
          fi
    postBuildScripts:
      # Sparkle is a binary xcframework target. XcodeGen's automatic embed
      # cannot resolve it, so copy the macOS slice ourselves. Signing happens
      # later in scripts/build.sh, after the universal binary is assembled.
      - name: "Embed Sparkle"
        basedOnDependencyAnalysis: false
        script: |
          set -euo pipefail
          source_framework=""
          for candidate in \
            "${BUILT_PRODUCTS_DIR}/PackageFrameworks/Sparkle.framework" \
            "${BUILD_DIR}/../../SourcePackages/artifacts/sparkle/Sparkle/Sparkle.xcframework/macos-arm64_x86_64/Sparkle.framework"; do
            if [ -d "$candidate" ]; then
              source_framework="$candidate"
              break
            fi
          done
          if [ -z "$source_framework" ]; then
            echo "error: Sparkle.framework not found; resolve packages first" >&2
            exit 1
          fi
          destination="${TARGET_BUILD_DIR}/${FRAMEWORKS_FOLDER_PATH}"
          mkdir -p "$destination"
          rm -rf "${destination}/Sparkle.framework"
          ditto "$source_framework" "${destination}/Sparkle.framework"
  EditorInteractionTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: App/SnapGlass/EditorTests
      - path: App/SnapGlass/Sources/AppLanguage.swift
      - path: App/SnapGlass/Sources/AppLocalization.swift
      - path: App/SnapGlass/Sources/ClipboardWriter.swift
      - path: App/SnapGlass/Sources/Pins/PinnedImageView.swift
      - path: App/SnapGlass/Sources/DesignSystem
      - path: App/SnapGlass/Sources/ScreenshotShelf
      - path: App/SnapGlass/Sources/History/HistoryMockupPresenter.swift
      - path: App/SnapGlass/Sources/Editor
        excludes:
          - EditorView.swift
          - AnnotationInspectorView.swift
          - ToolPickerView.swift
          - AnnotationCanvasView.swift
          - EditorWindowCloseGuard.swift
          - EditorWorkspaceView.swift
      - path: App/SnapGlass/Sources/MenuBar/ToastMessage.swift
      - path: App/SnapGlass/Sources/MenuBar/OCRSettings.swift
    dependencies:
      - package: SharedKit
      - package: CaptureCore
      - package: AnnotationCore
      - package: OCRCore
      - package: BarcodeCore
      - package: HistoryCore
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_MODULE_NAME: EditorInteractionTests
        PRODUCT_NAME: EditorInteractionTests
  WindowLifecycleStateTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: App/SnapGlass/Tests
        excludes:
          - BarcodePanel
      - path: App/SnapGlass/Sources/WindowLifecycleState.swift
      - path: App/SnapGlass/Sources/Windows/HistoryFailure.swift
      - path: App/SnapGlass/Sources/AppWindowPresenter.swift
      - path: App/SnapGlass/Sources/WindowPresentationCoordinator.swift
      - path: App/SnapGlass/Sources/AppWindowFocusing.swift
      - path: App/SnapGlass/Sources/Recording/RecordingQuitFlow.swift
      - path: App/SnapGlass/Sources/Recording/RecordingPermissionDecision.swift
    dependencies:
      - package: SharedKit
    settings:
      base:
        PRODUCT_NAME: WindowLifecycleStateTests
        PRODUCT_MODULE_NAME: WindowLifecycleStateTests
        GENERATE_INFOPLIST_FILE: YES
  BarcodePanelTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: App/SnapGlass/Tests/BarcodePanel
      - path: App/SnapGlass/Sources/Overlays/BarcodeResultPanel.swift
      - path: App/SnapGlass/Sources/Overlays/BarcodeResultPanel+Controls.swift
      - path: App/SnapGlass/Sources/Overlays/BarcodeScanState.swift
      - path: App/SnapGlass/Sources/AppLocalization.swift
      - path: App/SnapGlass/Sources/AppLanguage.swift
    dependencies:
      - package: SharedKit
      - package: CaptureCore
      - package: BarcodeCore
    settings:
      base:
        PRODUCT_NAME: BarcodePanelTests
        PRODUCT_MODULE_NAME: BarcodePanelTests
        GENERATE_INFOPLIST_FILE: YES
schemes:
  EditorInteractionTests:
    build:
      targets:
        EditorInteractionTests: test
    test:
      targets:
        - EditorInteractionTests
  WindowLifecycleStateTests:
    build:
      targets:
        WindowLifecycleStateTests: test
    test:
      targets:
        - WindowLifecycleStateTests
  BarcodePanelTests:
    build:
      targets:
        BarcodePanelTests: test
    test:
      targets:
        - BarcodePanelTests
