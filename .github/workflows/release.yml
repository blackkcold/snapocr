name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Extract version from tag
        id: version
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          VERSION="${TAG#v}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Extracted: tag=$TAG version=$VERSION"

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Install DMG tooling
        run: |
          python3 -m venv .build/dmg-tools
          .build/dmg-tools/bin/python -m pip install dmgbuild

      - name: Build Universal Release
        run: |
          bash scripts/build.sh \
            --version "${{ steps.version.outputs.version }}" \
            --release-dir .build/release-output

      - name: Package .app into .dmg
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          BUILT_APP=".build/release-output/SnapGlass.app"
          DMG_NAME="SnapGlass-v${VERSION}.dmg"

          DMGBUILD_PYTHON=".build/dmg-tools/bin/python" \
            bash scripts/package-dmg.sh \
              --app "$BUILT_APP" \
              --version "$VERSION" \
              --output-dir .

          echo "DMG_PATH=$DMG_NAME" >> "$GITHUB_ENV"
          echo "SHA_PATH=$DMG_NAME.sha256" >> "$GITHUB_ENV"

      - name: Generate release notes
        id: notes
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          TAG="${{ steps.version.outputs.tag }}"
          NOTES_FILE="release-notes.md"

          # 从 CHANGELOG.md 提取对应版本条目（精确匹配 ## [VERSION] - YYYY-MM-DD）
          awk -v ver="$VERSION" '
            $0 ~ "^## \\[" ver "\\] " { in_section = 1; print; next }
            in_section && $0 ~ "^## \\[" { exit }
            in_section { print }
          ' CHANGELOG.md > "$NOTES_FILE"

          # 动态解析上一个 tag（当前 tag 的父提交上的最近 tag）
          PREV_TAG="$(git describe --tags --abbrev=0 "${TAG}^" 2>/dev/null || echo "")"

          # 追加 Full Changelog 链接
          echo "" >> "$NOTES_FILE"
          echo "---" >> "$NOTES_FILE"
          echo "" >> "$NOTES_FILE"
          if [ -n "$PREV_TAG" ]; then
            echo "**Full Changelog**: https://github.com/blackkcold/snapocr/compare/${PREV_TAG}...${TAG}" >> "$NOTES_FILE"
          else
            echo "**Release**: https://github.com/blackkcold/snapocr/releases/tag/${TAG}" >> "$NOTES_FILE"
          fi

          echo "notes_file=$NOTES_FILE" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          TAG="${{ steps.version.outputs.tag }}"

          gh release create "$TAG" \
            --title "$TAG" \
            --notes-file "${{ steps.notes.outputs.notes_file }}" \
            "$DMG_PATH" \
            "$SHA_PATH"
