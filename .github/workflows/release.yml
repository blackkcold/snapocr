name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Extract version from tag
        id: version
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          VERSION="${TAG#v}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Extracted: tag=$TAG version=$VERSION"

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Install DMG tooling
        run: |
          python3 -m venv .build/dmg-tools
          .build/dmg-tools/bin/python -m pip install dmgbuild

      - name: Build Universal Release
        run: |
          bash scripts/build.sh \
            --version "${{ steps.version.outputs.version }}" \
            --release-dir .build/release-output

      - name: Package .app into .dmg
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          BUILT_APP=".build/release-output/SnapGlass.app"
          DMG_NAME="SnapGlass-v${VERSION}.dmg"

          DMGBUILD_PYTHON=".build/dmg-tools/bin/python" \
            bash scripts/package-dmg.sh \
              --app "$BUILT_APP" \
              --version "$VERSION" \
              --output-dir .

          echo "DMG_PATH=$DMG_NAME" >> "$GITHUB_ENV"
          echo "SHA_PATH=$DMG_NAME.sha256" >> "$GITHUB_ENV"

      - name: Generate release notes
        id: notes
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          TAG="${{ steps.version.outputs.tag }}"
          NOTES_FILE="release-notes.md"

          # 从 CHANGELOG.md 提取对应版本条目
          awk -v ver="## [${VERSION}]" '
            $0 ~ "^## \\[Unreleased\\]" { next }
            $0 ~ "^## \\[" { in_section = ($0 ~ ver) }
            in_section { print }
          ' CHANGELOG.md > "$NOTES_FILE"

          # 追加 Full Changelog 链接
          echo "" >> "$NOTES_FILE"
          echo "---" >> "$NOTES_FILE"
          echo "" >> "$NOTES_FILE"
          echo "**Full Changelog**: https://github.com/blackkcold/snapocr/compare/v0.1.5...${TAG}" >> "$NOTES_FILE"

          echo "notes_file=$NOTES_FILE" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          TAG="${{ steps.version.outputs.tag }}"

          gh release create "$TAG" \
            --title "$TAG" \
            --notes-file "${{ steps.notes.outputs.notes_file }}" \
            "$DMG_PATH" \
            "$SHA_PATH"
