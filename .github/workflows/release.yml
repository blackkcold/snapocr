name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Extract version from tag
        id: version
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          VERSION="${TAG#v}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Extracted: tag=$TAG version=$VERSION"

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Install DMG tooling
        run: |
          python3 -m venv .build/dmg-tools
          .build/dmg-tools/bin/python -m pip install dmgbuild

      - name: Build Universal Release
        run: |
          bash scripts/build.sh \
            --version "${{ steps.version.outputs.version }}" \
            --release-dir .build/release-output

      - name: Package .app into .dmg
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          BUILT_APP=".build/release-output/SnapGlass.app"
          DMG_NAME="SnapGlass-v${VERSION}.dmg"

          DMGBUILD_PYTHON=".build/dmg-tools/bin/python" \
            bash scripts/package-dmg.sh \
              --app "$BUILT_APP" \
              --version "$VERSION" \
              --output-dir .

          echo "DMG_PATH=$DMG_NAME" >> "$GITHUB_ENV"
          echo "SHA_PATH=$DMG_NAME.sha256" >> "$GITHUB_ENV"

      - name: Generate release notes
        id: notes
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          TAG="${{ steps.version.outputs.tag }}"
          NOTES_FILE="release-notes.md"

          # 从 CHANGELOG.md 提取对应版本条目，转换为统一的 emoji 分组风格。
          # 输出结构：
          #   vX.Y.Z — <副标题>
          #   ---
          #   ### ✨ 新增 / 🐛 修复 / ♻️ 改进 / 🔄 移除
          python3 - "$VERSION" "$TAG" "$NOTES_FILE" <<'PY'
          import re, subprocess, sys

          version, tag, notes_file = sys.argv[1], sys.argv[2], sys.argv[3]

          # 副标题取自 annotated tag 注释首行（格式 "vX.Y.Z — 描述"），去掉版本前缀
          try:
              subject = subprocess.check_output(
                  ["git", "for-each-ref", f"refs/tags/{tag}",
                   "--format=%(contents:subject)"],
                  text=True, stderr=subprocess.DEVNULL).strip()
              m = re.match(r"^v?[\d.]+\s*[—-]\s*(.+)$", subject)
              subtitle = m.group(1).strip() if m else ""
          except Exception:
              subtitle = ""

          # 分组标题映射：CHANGELOG 的 ### X → emoji 分组标题
          section_map = {
              "Added":   "### ✨ 新增",
              "Fixed":   "### 🐛 修复",
              "Changed": "### ♻️ 改进",
              "Removed": "### 🔄 移除",
              "Security": "### 🔐 安全",
              "Performance": "### ⚡ 性能优化",
          }

          lines = open("CHANGELOG.md", encoding="utf-8").read().splitlines()
          in_section = False
          items = []          # (emoji_heading, [bullet_lines])
          cur = None
          for ln in lines:
              if re.match(r"^## \[\s*" + re.escape(version) + r"\s*\]", ln):
                  in_section = True
                  continue
              if in_section and (re.match(r"^## \[", ln) or re.match(r"^\[[^\]]+\]:", ln)):
                  break
              if not in_section:
                  continue
              sec_m = re.match(r"^###\s+(\w+)", ln)
              if sec_m:
                  heading = section_map.get(sec_m.group(1))
                  if heading:
                      cur = heading
                      items.append([heading])
                  continue
              if cur is not None and ln.strip():
                  items[-1].append(ln.rstrip())

          body = []
          if subtitle:
              body.append(f"v{version} — {subtitle}")
          elif items:
              body.append(f"v{version}")
          body.append("")
          body.append("---")
          body.append("")
          for heading, *bullets in items:
              body.append(heading)
              body.append("")
              body.extend(bullets)
              body.append("")
          body.append("---")
          body.append("")

          # 动态解析上一个 tag（当前 tag 的父提交上的最近 tag）
          try:
              prev = subprocess.check_output(
                  ["git", "describe", "--tags", "--abbrev=0", f"{tag}^"],
                  text=True, stderr=subprocess.DEVNULL).strip()
          except Exception:
              prev = ""
          if prev:
              body.append(f"**Full Changelog**: https://github.com/blackkcold/snapocr/compare/{prev}...{tag}")
          else:
              body.append(f"**Release**: https://github.com/blackkcold/snapocr/releases/tag/{tag}")

          with open(notes_file, "w", encoding="utf-8") as f:
              f.write("\n".join(body).strip() + "\n")
          PY

          echo "notes_file=$NOTES_FILE" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          TAG="${{ steps.version.outputs.tag }}"

          gh release create "$TAG" \
            --title "$TAG" \
            --notes-file "${{ steps.notes.outputs.notes_file }}" \
            "$DMG_PATH" \
            "$SHA_PATH"
