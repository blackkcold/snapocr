name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - run: brew install swiftlint
      - run: brew install swift-format
      - run: swift-format lint --recursive . --configuration .swift-format
      - run: swiftlint lint --strict --config .swiftlint.yml

  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - run: brew install xcodegen
      - run: xcodegen generate
      - run: |
          xcodebuild \
            -project SnapGlass.xcodeproj \
            -scheme SnapGlass \
            -configuration Release \
            build \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: SnapGlass-app
          path: .build/DerivedData-release/Build/Products/Release/SnapGlass.app
          if-no-files-found: warn

  unit-test:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          for pkg in SharedKit CaptureCore OCRCore BarcodeCore AnnotationCore ScrollCore HistoryCore; do
            swift test --package-path "Packages/$pkg" || exit 1
          done

  ui-smoke:
    runs-on: self-hosted
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
      - run: brew install xcodegen
      - run: xcodegen generate
      - run: xcodebuild -project SnapGlass.xcodeproj -scheme SnapGlassUITests test