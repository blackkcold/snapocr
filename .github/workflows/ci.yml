name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - run: brew install swiftlint
      - run: brew install swift-format
      - run: swift-format lint --recursive . --configuration .swift-format
      - run: swiftlint lint --strict --config .swiftlint.yml

  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - run: brew install xcodegen
      - run: xcodegen generate
      - run: |
          xcodebuild \
            -project SnapGlass.xcodeproj \
            -scheme SnapGlass \
            -configuration Release \
            build \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: SnapGlass-app
          path: .build/DerivedData-release/Build/Products/Release/SnapGlass.app
          if-no-files-found: warn

  unit-test:
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - run: |
          for pkg in SharedKit CaptureCore OCRCore BarcodeCore AnnotationCore ScrollCore HistoryCore AutomationCore; do
            echo "=== $pkg ==="
            if [ "$pkg" = "OCRCore" ]; then
              # 跳过依赖真实 Vision OCR 的集成测试：无头 CI runner 上 Vision 首次初始化可能挂起。
              # 本地仍完整运行这些测试（见 scripts/test.sh）。详见 Docs/CI.md。
              swift test --package-path "Packages/$pkg" \
                --skip VisionIntegrationTests \
                --skip pipelineFallsBackToVisionWhenTesseractDataIsMissing || exit 1
            else
              swift test --package-path "Packages/$pkg" || exit 1
            fi
          done
        timeout-minutes: 10